name: Scrape Final August 18th ASDDO Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4,16 * * *' # Runs automatically twice a day (Free unlimited minutes on public repo)

jobs:
  scrape-and-extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Public Scraper Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install pypdf requests beautifulsoup4

      - name: Run Stage 1 - Discover August 18th Published PDFs
        run: |
          node scripts/1-discover.mjs

      - name: Run Stage 2 - Extract Plaintext Voters (All Columns)
        run: |
          node scripts/2-extract.mjs

      - name: Run Stage 3 - Build Analytics and Constituency Index
        run: |
          node scripts/build_analytics_and_index.mjs

      - name: Upload Extracted Clean Datasets Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: karnataka-asddo-final-aug18-data
          path: |
            data/
            cache/manifest.json

      - name: Commit and Push Updated Final Datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ cache/manifest.json
          git commit -m "chore(data): auto-update final August 18th ASDDO dataset" || echo "No changes to commit"
          git push origin main
