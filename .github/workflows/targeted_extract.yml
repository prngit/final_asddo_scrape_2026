name: Targeted Single District Scrape (Custom Drive URL)

on:
  workflow_dispatch:
    inputs:
      district:
        description: 'Select District to Scrape'
        required: true
        type: choice
        options:
          - "BAGALKOT"
          - "CHIKKABALLAPUR"
          - "KOLAR"
          - "KOPPAL"
          - "B.B.M.P(CENTRAL)"
          - "B.B.M.P(NORTH)"
          - "B.B.M.P(SOUTH)"
          - "BANGALORE RURAL"
          - "BANGALORE URBAN"
          - "BELGAUM"
          - "BELLARY"
          - "BIDAR"
          - "BIJAPUR"
          - "CHAMARAJNAGAR"
          - "CHIKKMAGALUR"
          - "CHITRADURGA"
          - "DAKSHINA KANNADA"
          - "DAVANGERE"
          - "DHARWAD"
          - "GADAG"
          - "GULBARGA"
          - "HASSAN"
          - "HAVERI"
          - "KODAGU"
          - "MANDYA"
          - "MYSORE"
          - "RAICHUR"
          - "RAMANAGARAM"
          - "SHIMOGA"
          - "TUMKUR"
          - "UDUPI"
          - "UTTARA KANNADA"
          - "VIJAYANAGARA"
          - "YADGIR"
      custom_url:
        description: 'Google Drive Folder / NIC URL (Leave blank to use default)'
        required: false
        type: string
        default: ''

jobs:
  scrape-targeted-district:
    name: Scrape District (${{ github.event.inputs.district }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Targeted Extraction
        run: |
          if [ -n "${{ github.event.inputs.custom_url }}" ]; then
            node scraper_scripts/custom-extract.mjs --district "${{ github.event.inputs.district }}" --url "${{ github.event.inputs.custom_url }}"
          else
            node scraper_scripts/custom-extract.mjs --district "${{ github.event.inputs.district }}"
          fi

      - name: Upload Extracted District Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-district-${{ github.event.inputs.district }}
          path: cache/extracted/
          retention-days: 7

      - name: Commit and Push Extracted NDJSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/
          git commit -m "chore(data): extracted ${{ github.event.inputs.district }}" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
