name: Targeted Multi-District Scrape (Custom Drive URL)

on:
  workflow_dispatch:
    inputs:
      districts:
        description: 'Enter District(s) to Scrape (comma-separated or single)'
        required: true
        type: string
        default: 'BAGALKOT, CHIKKABALLAPUR, KOLAR, KOPPAL'
      custom_url:
        description: 'Google Drive Folder / NIC URL (Leave blank to use default CEO link)'
        required: false
        type: string
        default: ''

jobs:
  scrape-targeted-districts:
    name: Scrape Districts (${{ github.event.inputs.districts }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Multi-District Extraction
        run: |
          if [ -n "${{ github.event.inputs.custom_url }}" ]; then
            node scraper_scripts/custom-extract.mjs --district "${{ github.event.inputs.districts }}" --url "${{ github.event.inputs.custom_url }}"
          else
            node scraper_scripts/custom-extract.mjs --district "${{ github.event.inputs.districts }}"
          fi

      - name: Upload Extracted Districts Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-districts-data
          path: cache/extracted/
          retention-days: 7

      - name: Commit and Push Extracted NDJSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/
          git commit -m "chore(data): extracted ${{ github.event.inputs.districts }}" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
